name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds libmagic.so inside the official manylinux_2_28 image (glibc 2.28)
  # from the version pinned in scripts/build-lib.sh, plus stages the Magdir
  # fragments. glibc's backwards compatibility means this baseline still
  # runs fine on our actual RHEL9 deployment target (glibc 2.34) while also
  # installing on much older/broader distros -- building in an arbitrary,
  # newer-glibc image and relabeling the result after the fact would not.
  # Every other job consumes this as an artifact instead of rebuilding it,
  # so the pinned upstream source is compiled exactly once per run.
  build-lib:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc make autoconf automake libtool gettext \
            zlib-devel bzip2-devel xz-devel
      - uses: actions/checkout@v4
      - name: Build libmagic.so + stage Magdir fragments
        run: scripts/build-lib.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libmagic-lib
          path: |
            src/libmagic/data/libmagic.so.1
            src/libmagic/data/magdir/
            src/libmagic/data/default.mgc
            src/libmagic/_upstream_version.py
            LICENSE.file-upstream

  lint:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests

  test:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      # rpmbuild/rpm for the `libmagic-wheel rpm` tests -- not preinstalled
      # on the Ubuntu runner (Debian/Ubuntu is .deb-based).
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: pytest

  # Runs in the same manylinux_2_28 container as build-lib -- auditwheel
  # vendors shared libraries (liblzma, libzstd) by resolving them on
  # whatever host it runs on, so doing this on a plain ubuntu-latest
  # runner would silently vendor Ubuntu's newer system libraries instead
  # of manylinux_2_28's, defeating the whole point of that baseline.
  build-wheel:
    needs: [lint, test]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - run: /opt/python/cp313-cp313/bin/python3.13 -m pip install build auditwheel patchelf
      - run: PATH="/opt/python/cp313-cp313/bin:$PATH" scripts/build-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
