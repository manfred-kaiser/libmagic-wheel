name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds libmagic.so against RHEL9's glibc baseline (the actual deployment
  # target) from the version pinned in scripts/build-lib.sh, plus stages the
  # Magdir fragments. Every other job consumes this as an artifact instead
  # of rebuilding it, so the pinned upstream source is compiled exactly
  # once per run.
  build-lib:
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi9/ubi
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc make autoconf automake libtool gettext-devel \
            zlib-devel bzip2-devel xz-devel libseccomp-devel
      - uses: actions/checkout@v4
      - name: Build libmagic.so + stage Magdir fragments
        run: scripts/build-lib.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libmagic-lib
          path: |
            src/libmagic/data/libmagic.so.1
            src/libmagic/data/magdir/
            src/libmagic/data/default.mgc
            LICENSE.file-upstream

  lint:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: mypy src tests

  test:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      # rpmbuild/rpm for the `libmagic-wheel rpm` tests -- not preinstalled
      # on the Ubuntu runner (Debian/Ubuntu is .deb-based).
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: pytest

  build-wheel:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: scripts/build-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
