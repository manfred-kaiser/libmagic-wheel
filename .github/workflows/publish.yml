name: Publish

on:
  release:
    types: [published]

jobs:
  # See ci.yml for why manylinux_2_28 (not an arbitrary/newer-glibc image)
  # is the build container.
  build-lib:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc make autoconf automake libtool gettext \
            zlib-devel bzip2-devel xz-devel
      - uses: actions/checkout@v4
      - name: Build libmagic.so + stage Magdir fragments
        run: scripts/build-lib.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libmagic-lib
          path: |
            src/libmagic/data/libmagic.so.1
            src/libmagic/data/magdir/
            src/libmagic/data/default.mgc
            src/libmagic/_upstream_version.py
            LICENSE.file-upstream

  lint:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests

  test:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: pytest

  build-wheel:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmagic-lib
          path: .
      - run: chmod +x src/libmagic/data/libmagic.so.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build auditwheel patchelf
      - run: scripts/build-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # Trusted Publishing (OIDC): no PyPI API token stored anywhere. The
  # "pypi" environment name here must match the environment configured in
  # the project's PyPI Trusted Publisher setup exactly.
  publish:
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
