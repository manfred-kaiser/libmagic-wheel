[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libmagic-wheel"
version = "0.2.1"
authors = [
    {name = "SSH-MITM Dev-Team", email = "support@ssh-mitm.at"}
]
maintainers = [
    {name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at"}
]
description = "A specific, pinned libmagic version bundled as a wheel, for our own applications where the distro's version is too old to read newer .mgc databases"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE.file-upstream"]
keywords = [
    "libmagic",
    "magic",
    "file-type",
    "mime",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/manfred-kaiser/libmagic-wheel"
Changelog = "https://github.com/manfred-kaiser/libmagic-wheel/blob/main/CHANGELOG.md"
Source = "https://github.com/manfred-kaiser/libmagic-wheel"
Tracker = "https://github.com/manfred-kaiser/libmagic-wheel/issues"

[project.scripts]
libmagic-wheel = "libmagic.cli:main"

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"libmagic" = ["py.typed"]
"libmagic.data" = ["libmagic.so.1", "magdir/*", "default.mgc"]

[tool.pytest.ini_options]
addopts = "--cov=libmagic --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
strict = true
install_types = true
non_interactive = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "E501",    # line too long
    "CPY001",  # no copyright-header convention decided for this project yet
    "COM812",  # conflicts with the ruff formatter (ruff's own recommendation)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is exactly what pytest tests should use
    "D",       # no docstring burden on test functions
    "SLF001",  # white-box tests deliberately reach into private state
    "PLR2004", # literal comparisons against sample bytes are the point
    "S603",    # subprocess calls here use fixed, developer-written argv only
    "S607",    # commands here are resolved from PATH intentionally (e.g. "rpm"), not attacker-controlled
    "FBT001",  # positional bool params on test helpers are fine, unlike on public API
    "FBT002",  # same distinction, for the defaulted-bool-parameter variant of the rule
]
"src/libmagic/cli.py" = [
    "T201",    # print() is the CLI's actual output, not a stray debug print
]

[tool.bumpversion]
current_version = "0.2.1"

[[tool.bumpversion.files]]
filename = "src/libmagic/__init__.py"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/manfred-kaiser/libmagic-wheel/compare/{current_version}...main"
replace = """[Unreleased]: https://github.com/manfred-kaiser/libmagic-wheel/compare/{new_version}...main
[{new_version}]: https://github.com/manfred-kaiser/libmagic-wheel/compare/{current_version}...{new_version}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""
